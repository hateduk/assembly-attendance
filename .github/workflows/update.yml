name: 출석 데이터 갱신

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 국회 API에서 표결 기록 수집
        env:
          ASSEMBLY_KEY: ${{ secrets.ASSEMBLY_KEY }}
        run: node scripts/fetch.mjs
      - name: 상임위 회의록에서 출석 명단 수집 (시범)
        continue-on-error: true   # 이 단계가 실패해도 본회의 데이터 갱신은 그대로 반영합니다
        env:
          ASSEMBLY_KEY: ${{ secrets.ASSEMBLY_KEY }}
          COMMITTEES: 교육위원회    # 쉼표로 위원회를 더 추가할 수 있습니다 (예: 교육위원회,보건복지위원회)
        run: node scripts/fetch-committee.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main   # 그 사이 다른 변경이 있어도 합쳐서 올립니다
          git push
